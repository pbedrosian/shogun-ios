# Project key and organization are provided by CI configuration, not guessed here.
sonar.projectName=Shogun iOS
sonar.sourceEncoding=UTF-8
sonar.sources=apps/ios/Shogun
sonar.tests=apps/ios/ShogunTests,apps/ios/ShogunUITests
sonar.inclusions=**/*.swift
sonar.exclusions=**/Assets.xcassets/**,**/GeneratedAssetSymbols.swift
sonar.coverageReportPaths=build/ci/sonarqube-coverage.xml
# Report coverage on all app Swift files, including views. Do not hide untested UI.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
