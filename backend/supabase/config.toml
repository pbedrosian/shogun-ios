# Local development only. Supabase CLI version is pinned in package-lock.json.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "shogun-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# SHO-18 must explicitly grant access and enable RLS on application tables.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Local accounts are created through Auth by backend:fixtures, never deployable SQL seeds.
enabled = false
sql_paths = []

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# Browser email testing only; native app callback is agreed/registered in SHO-19/26.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["shogun://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local development only: sign-ups receive a session immediately.
# Keep email confirmation enabled when configuring a hosted/production project.
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"

# Storage and Realtime remain disabled until their integration tickets.
[realtime]
enabled = false
[storage]
enabled = false
[edge_runtime]
enabled = true
[analytics]
# Start local Logflare and Vector with the backend so Studio can query service logs.
enabled = true
backend = "postgres"
port = 54327
# The default 54328 is used by our Swagger viewer; 54329 is reserved for pooler.
vector_port = 54330

[functions.delete-account]
# Auth /user validates the JWT online, including current account existence.
# Supports local/hosted signing keys without relying on legacy gateway JWT checks.
verify_jwt = false

[edge_runtime.secrets]
TMDB_READ_ACCESS_TOKEN = "env(TMDB_READ_ACCESS_TOKEN)"

[functions.catalog]
# The handler verifies the live Auth user; never accept a caller-supplied user ID.
verify_jwt = false
